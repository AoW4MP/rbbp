        <script src="/rbbp/Data/Init.js"></script>
        <script>

                        function HandlePage() {
                           function getCenter(el) {
                               const rect = el.getBoundingClientRect();
                               return {
                                   x: rect.left + rect.width / 2,
                                   y: rect.top + rect.height / 2
                               };
                           }

                           function generatePathSettings(entry1, entry2, offset) {
                                const p1 = getCenter(entry1);
                               const p2 = getCenter(entry2);
                               // Example: simple "elbow" path (horizontal then vertical)
                               const midX = p1.x + offset;
                               const path = `
               M ${p1.x},${p1.y}
               H ${midX}
               V ${p2.y}
               H ${p2.x}
             `;
                               return path;
                           }

                           const holder = document.getElementById("holder");
                           const holderSVG = document.getElementById("holderSVG");
                           const nodes = new Map();
                           for (const entry of jsonCityTreeNodes) {
                               const node = document.createElement("div");
                               node.className = "box";
                               node.textContent = entry.id;
                               node.id = entry.id;
                               holder.appendChild(node);
                               nodes.set(entry.id, node);
                           }
                           for (const entry of jsonCityTreeNodes) {
                               for (const connection of entry.connectTo) {
                                   const target = nodes.get(connection.id);
                                   if (!target) continue;
                                   const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                                   path.setAttribute("d", generatePathSettings(target, nodes.get(entry.id), 100));
                                   path.setAttribute("fill", "none");
                                   path.setAttribute("stroke", "white");
                                   holderSVG.appendChild(path);
                               }
                           }
                       }
        </script>

        <title>Age of Wonders 4 RbbP - Abilities List</title>
    </head>

    <body>
        <div id="holder"></div>
      
        <svg id="holderSVG" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%">
             </svg>

        <style>
            .box {
                position: relative;
                width: 100px;
                height: 50px;
                background: lightblue;
                border: 1px solid #333;
                text-align: center;
                line-height: 50px;
            }
        </style>
    </body>
