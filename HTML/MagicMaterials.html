<!doctype html>
<html lang="en">
    <head>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-CC3NE8PT7K"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());

            gtag("config", "G-CC3NE8PT7K");
        </script>
        <link rel="shortcut icon" type="image/x-icon" href="/rbbp/favicon.ico" />
        <link rel="stylesheet" type="text/css" href="/rbbp/Style/style.css" />
        <meta charset="UTF-8" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

         <script src="/rbbp/Data/Init.js"></script>
        <script>
            function HandlePage() {
                showWorldStructuresWithArgument("Void Stones", "void_stones", null, "Void Stones");
                showWorldStructuresWithArgument("Ores", "ore", null, "Ores");
                showWorldStructuresWithArgument("Liquids", "liquid", null, "Liquids");
                showWorldStructuresWithArgument("Plants", "plant", null, "Plants");
                SetLevelUpStuff();
                renderMaterialCollections();
            }

            function renderMaterialCollections() {
                const lookup = id => findBy(jsonAllFromPOLocalized, "id", id) || findBy(jsonAllFromPO, "id", id);
                const collectionLabel = lookup("INTERFACE@TEXT").collection_effect;
                for (const card of document.querySelectorAll("[data-collection]")) {
                    const { collection, effect } = card.dataset;
                    const group = lookup(collection);
                    const bonus = lookup(effect);
                    card.querySelector("h2").textContent = group.name;
                    card.querySelector(".collection-label").textContent = collectionLabel;
                    card.querySelector("h3").textContent = bonus.name;
                    card.querySelector(".collection-description").innerHTML = AddTagIconsForStatusEffects(
                        bonus.description.replaceAll("++", "+").replace(/<hyperlink>Void stones<\/hyperlink>/gi,
                            "<hyperlink>" + group.name + "</hyperlink>")
                    );
                }
            }
        </script>

        <title>Age of Wonders 4 RbbP - Magic Materials</title>
    </head>

    <body>
        <div id="header"></div>

        <div class="textblocktitle">Magic Materials</div>

        <div class="w3-container">
            <div class="w3-bar w3-black" id="buttonHolder"></div>

            <section class="mod_card" data-collection="DLC@ELDRITCHREALMS@NODES_STRATEGIC@VOID_STONES" data-effect="DLC@ELDRITCHREALMS@NODES_STRATEGIC@VOID_STONES_SET_BONUS">
                <div class="structure_image_holder">
                    <h2 class="mod_name"></h2>
                    <div class="mod_description">
                        <div class="collection-label"></div>
                        <h3 class="mod_name"></h3>
                        <div class="collection-description"></div>
                    </div>
                </div>
            </section>
            <div id="Void Stones"></div>

            <section class="mod_card" data-collection="MAGICMATERIALS@ORES" data-effect="MAGICMATERIALS@RINGS_OF_BINDING">
                <div class="structure_image_holder">
                    <h2 class="mod_name"></h2>
                    <div class="mod_description">
                        <div class="collection-label"></div>
                        <h3 class="mod_name"></h3>
                        <div class="collection-description"></div>
                    </div>
                </div>
            </section>
            <div id="Ores"></div>

            <section class="mod_card" data-collection="MAGICMATERIALS@LIQUIDS" data-effect="MAGICMATERIALS@COSMICFLUX_ELIXIR">
                <div class="structure_image_holder">
                    <h2 class="mod_name"></h2>
                    <div class="mod_description">
                        <div class="collection-label"></div>
                        <h3 class="mod_name"></h3>
                        <div class="collection-description"></div>
                    </div>
                </div>
            </section>
            <div id="Liquids"></div>

            <section class="mod_card" data-collection="MAGICMATERIALS@PLANTS" data-effect="MAGICMATERIALS@IMPERIAL_ESSENCE">
                <div class="structure_image_holder">
                    <h2 class="mod_name"></h2>
                    <div class="mod_description">
                        <div class="collection-label"></div>
                        <h3 class="mod_name"></h3>
                        <div class="collection-description"></div>
                    </div>
                </div>
            </section>
            <div id="Plants"></div>
        </div>
    </body>
    <script></script>
</html>
