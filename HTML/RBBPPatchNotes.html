        <script src="/rbbp/Data/Init.js"></script>
        <script>
            // Страница работает в двух режимах в зависимости от query-параметра
            // ?version= : без него - список всех патчей со ссылками (главная страница
            // патчноутов), с ним - содержимое одного конкретного патча (TOC + текст,
            // как раньше была устроена единственная страница целиком).
            async function HandlePage() {
                const lang = (typeof languageSelect !== "undefined" && languageSelect.value) || "RU";
                const version = new URLSearchParams(location.search).get("version");

                const patches = await LoadRbbpPatches(lang);

                if (!version) {
                    RenderRbbpPatchIndex(patches, lang);
                    return;
                }

                const patch = patches.find((p) => p.version === version);
                if (!patch) {
                    RenderRbbpPatchNotFound(version, lang);
                    return;
                }
                await RenderRbbpPatchDetail(patch, lang);
            }

            // Грузит Data/RU/RBBPPatchNotes.json и Data/<lang>/RBBPPatchNotes.json и
            // сливает их ПО НОМЕРУ ПАТЧА (не по файлу целиком, как в старой
            // однопатчевой версии страницы) - так патч, ещё не переведённый на
            // выбранный язык, всё равно появляется в списке и открывается с
            // RU-содержимым и пометкой "не переведено", а не пропадает совсем или не
            // ломает показ уже переведённых патчей рядом с ним.
            async function LoadRbbpPatches(lang) {
                const ruData = await fetch("/rbbp/Data/RU/RBBPPatchNotes.json").then((r) => r.json());
                let langData = null;
                if (lang !== "RU") {
                    try {
                        const res = await fetch("/rbbp/Data/" + lang + "/RBBPPatchNotes.json");
                        if (res.ok) langData = await res.json();
                    } catch (e) {
                        // файла перевода для этого языка нет вообще - ничего страшного,
                        // ниже все патчи просто попадут в список как непереведённые
                    }
                }

                const ruByVersion = new Map((ruData.patches || []).map((p) => [p.version, p]));
                const langByVersion = new Map(
                    langData && langData.patches ? langData.patches.map((p) => [p.version, p]) : []
                );
                const allVersions = new Set([...ruByVersion.keys(), ...langByVersion.keys()]);

                const merged = [];
                for (const v of allVersions) {
                    const langPatch = langByVersion.get(v);
                    const ruPatch = ruByVersion.get(v);
                    const translated = lang === "RU" || !!langPatch;
                    const source = translated ? langPatch || ruPatch : ruPatch;
                    merged.push({ version: v, date: source.date, html: source.html, translated });
                }
                merged.sort((a, b) => b.date.localeCompare(a.date));
                return merged;
            }

            function FormatRbbpDate(isoDate) {
                const [y, m, d] = isoDate.split("-");
                return d + "." + m + "." + y;
            }

            function RenderRbbpPatchIndex(patches, lang) {
                ApplyRbbpUiStrings(lang, { mode: "index" });
                document.getElementById("rbbpToc").style.display = "none";
                document.getElementById("rbbpNotice").style.display = "none";
                document.title = "Age of Wonders 4 RbbP - RBBP Patch Notes";

                const article = document.getElementById("rbbpContent");
                const strings = RBBP_UI_STRINGS[lang] || RBBP_UI_STRINGS.RU;

                if (patches.length === 0) {
                    const p = document.createElement("p");
                    p.className = "rbbp-patch-empty";
                    p.textContent = strings.empty;
                    article.innerHTML = "";
                    article.appendChild(p);
                    return;
                }

                const list = document.createElement("ul");
                list.className = "rbbp-patch-list";
                for (const p of patches) {
                    const li = document.createElement("li");
                    const a = document.createElement("a");
                    a.href = "/rbbp/HTML/RBBPPatchNotes.html?version=" + encodeURIComponent(p.version);

                    const version = document.createElement("span");
                    version.className = "rbbp-patch-version";
                    version.textContent = p.version;

                    const date = document.createElement("span");
                    date.className = "rbbp-patch-date";
                    date.textContent = "(" + FormatRbbpDate(p.date) + ")";

                    a.appendChild(version);
                    a.appendChild(date);

                    if (!p.translated) {
                        const badge = document.createElement("span");
                        badge.className = "rbbp-patch-badge";
                        badge.textContent = strings.notTranslatedBadge;
                        a.appendChild(badge);
                    }

                    li.appendChild(a);
                    list.appendChild(li);
                }
                article.innerHTML = "";
                article.appendChild(list);
            }

            async function RenderRbbpPatchDetail(patch, lang) {
                const article = document.getElementById("rbbpContent");
                const notice = document.getElementById("rbbpNotice");
                document.getElementById("rbbpToc").style.display = "";

                if (!patch.translated) {
                    notice.style.display = "block";
                    notice.innerHTML =
                        "This page hasn't been translated to English yet. Showing the Russian version below.";
                } else {
                    notice.style.display = "none";
                }

                let html = patch.html;
                // сайтовая AddTagIconsForStatusEffects() тут НЕ используется: она матчит
                // способности/эффекты по голым RU-подстрокам без учёта контекста предложения
                // (см. ниже LinkRbbpEntitiesByEnglishName - её место заняла более точная система)
                html = RbbpTagResourceIcons(html);

                // контент конкретного патча может быть на RU или EN в зависимости от того,
                // нашёлся ли перевод (см. patch.translated выше), а глобальный переключатель
                // языка сайта может не совпадать с этим, поэтому для связывания сущностей
                // нельзя полагаться на jsonTomesLocalized/jsonFactionCreation "как есть" -
                // они следуют ЗА глобальным переключателем, а не за языком этой статьи
                const contentLang = patch.translated ? lang : "RU";
                window.__rbbpContentLang = contentLang;
                ApplyRbbpUiStrings(contentLang, { mode: "detail", version: patch.version, date: patch.date });
                const entityIndex = await BuildRbbpEntityIndexByEnglishName(contentLang);
                html = LinkRbbpEntitiesByEnglishName(html, entityIndex, contentLang);

                article.innerHTML = html;
                MoveRbbpHeadingIconsToFront(article);

                if (typeof HandleExtraTooltips === "function") {
                    HandleExtraTooltips(article);
                }
                AttachRbbpEntityTooltips(article, entityIndex);

                BuildRbbpToc(article);

                document.title = "Age of Wonders 4 RbbP - Patch " + patch.version;
            }

            // Автосвязывание (см. LinkRbbpEntitiesByEnglishName ниже) вставляет иконку
            // ровно там, где стоит "(EnglishName)"/{{EnglishName}} в исходном тексте - для
            // заголовков вида "## Аскеты трансформации (Transformation Ascetics)" это
            // означает, что иконка оказывается ПОСЛЕ русского названия, а не в самом начале
            // заголовка, как у [код]-заголовков (Cultures/Classes/...). Простой строковый
            // regex-фикс на этапе LinkRbbpEntitiesByEnglishName ненадёжен (надо было бы
            // парсить HTML заголовка внутри regex-колбэка) - проще один раз пройтись по уже
            // отрендеренному DOM и перенести найденную иконку в начало. [код]-заголовки не
            // трогаем - они и так защищены от автосвязывания (см. rbbp-inline-icon в
            // LinkRbbpEntitiesByEnglishName), их первым ребёнком всегда стоит .rbbp-inline-icon,
            // а .rbbp-entity-icon внутри них попросту не будет найден.
            function MoveRbbpHeadingIconsToFront(article) {
                const headings = article.querySelectorAll("h2, h3, h4");
                headings.forEach((h) => {
                    const icon = h.querySelector("img.rbbp-entity-icon");
                    if (!icon || h.firstChild === icon) return;
                    h.insertBefore(icon, h.firstChild);
                });
            }

            function RenderRbbpPatchNotFound(version, lang) {
                document.getElementById("rbbpToc").style.display = "none";
                document.getElementById("rbbpNotice").style.display = "none";
                ApplyRbbpUiStrings(lang, { mode: "index" });

                const article = document.getElementById("rbbpContent");
                article.innerHTML = "";

                const p1 = document.createElement("p");
                p1.textContent =
                    lang === "RU" ? 'Патч "' + version + '" не найден.' : 'Patch "' + version + '" not found.';
                const p2 = document.createElement("p");
                const a = document.createElement("a");
                a.className = "rbbp-backlink";
                a.href = "/rbbp/HTML/RBBPPatchNotes.html";
                a.textContent = (RBBP_UI_STRINGS[lang] || RBBP_UI_STRINGS.RU).backToList;
                p2.appendChild(a);

                article.appendChild(p1);
                article.appendChild(p2);
            }

            // ---------- локализация статичной "рамки" страницы (не JSON-контента) ----------
            const RBBP_UI_STRINGS = {
                RU: {
                    tocTitle: "Содержание",
                    indexSubtitle: "История изменений мода RbbP по релизам",
                    detailSubtitlePrefix: "Патч ",
                    backToList: "← Ко всем патчам",
                    backToGuide: "← Назад к основному руководству RBBP",
                    notTranslatedBadge: "не переведено",
                    empty: "Патчноуты пока не опубликованы."
                },
                EN: {
                    tocTitle: "Contents",
                    indexSubtitle: "RbbP mod changelog by release",
                    detailSubtitlePrefix: "Patch ",
                    backToList: "← All patches",
                    backToGuide: "← Back to the main RBBP guide",
                    notTranslatedBadge: "not translated",
                    empty: "No patch notes published yet."
                }
            };

            function ApplyRbbpUiStrings(chromeLang, view) {
                const strings = RBBP_UI_STRINGS[chromeLang] || RBBP_UI_STRINGS.RU;
                const tocTitle = document.querySelector(".rbbp-toc-title");
                if (tocTitle) tocTitle.textContent = strings.tocTitle;

                const subtitle = document.getElementById("rbbpSubtitle");
                const backlinks = document.getElementById("rbbpBacklinks");
                if (!subtitle || !backlinks) return;

                backlinks.innerHTML = "";
                const toGuide = document.createElement("a");
                toGuide.className = "rbbp-backlink";
                toGuide.href = "/rbbp/HTML/RBBP.html";
                toGuide.textContent = strings.backToGuide;

                if (view.mode === "detail") {
                    subtitle.textContent = strings.detailSubtitlePrefix + view.version + " (" + FormatRbbpDate(view.date) + ")";
                    const toList = document.createElement("a");
                    toList.className = "rbbp-backlink";
                    toList.href = "/rbbp/HTML/RBBPPatchNotes.html";
                    toList.textContent = strings.backToList;
                    backlinks.appendChild(toList);
                    backlinks.appendChild(toGuide);
                } else {
                    subtitle.textContent = strings.indexSubtitle;
                    backlinks.appendChild(toGuide);
                }
            }

            // ---------- иконки ресурсов рядом с числами (10 золота -> 10 <gold> золота) ----------
            const RBBP_RESOURCE_TAGS = [
                [/(\d+)(\s+)(золот[а-яё]*)/gi, "gold"],
                [/(\d+)(\s+)(маны|мана\b)/gi, "mana"],
                [/(\d+)(\s+)(знани[а-яё]*)/gi, "knowledge"],
                [/(\d+)(\s+)(пищ[а-яё]*)/gi, "food"],
                [/(\d+)(\s+)(производств[а-яё]*)/gi, "production"],
                [/(\d+)(\s+)(найм[а-яё]*)/gi, "draft"],
                [/(\d+)(\s+)(влияни[а-яё]*)/gi, "influence"],
                [/(\d+)(\s+)(стабильност[а-яё]*)/gi, "happiness"]
            ];

            function RbbpTagResourceIcons(html) {
                for (const [regex, tag] of RBBP_RESOURCE_TAGS) {
                    html = html.replace(regex, (m, num, space, word) => `${num}${space}<${tag}></${tag}>${word}`);
                }
                return html;
            }

            // ---------- ссылки на объекты вики: тома/постройки/юниты/заклинания/способности ----------
            // Триггер - ТОЛЬКО точное совпадение английского названия в скобках, которое
            // автор текста сам расставляет рядом с русским (напр. "Покров мрака (Pall of
            // Gloom)"). Раньше матчинг шёл по голым RU-подстрокам - это ловило случайные
            // совпадения обычных русских слов с названиями сущностей без учёта контекста
            // предложения (напр. "Призыв" как обычное слово vs субкультура "Призыв", или
            // "Покров мрака"/"Ритуал ускорения" как части описания vs совпадающее название
            // способности/заклинания в данных игры). Английские игровые названия гораздо
            // менее склонны к таким случайным коллизиям с обычной речью.
            //
            // Культуры/происхождения/классы/стремления героев сюда сознательно НЕ включены:
            // в этом документе они и так явно помечены кодами вида [hero]/[warhero] прямо в
            // заголовках - добавление их же в автопоиск давало задвоенные иконки на той же
            // строке (код уже вставил иконку, а автопоиск находил то же имя ещё раз).
            async function BuildRbbpEntityIndexByEnglishName(contentLang) {
                const index = new Map();

                function add(enName, entry) {
                    if (!enName) return;
                    // некоторые постройки (StructureUpgrades.json) хранят готовый инлайн-тег
                    // прямо в поле name ("<conduit></conduit> Glacial Megalith") - без этой
                    // очистки такие постройки никогда не совпадут с текстом статьи, где
                    // просто "Glacial Megalith" без тега (see CLAUDE.md, раздел 8.2 - это
                    // касается ~100 из 349 построек, не только этой одной)
                    enName = enName.replace(/^<[a-zA-Z]+><\/[a-zA-Z]+>\s*/, "").trim();
                    // 11 из 53 social-трейтов (Traits.json) хранят тег С ДРУГОЙ стороны имени
                    // ("Apex Predators <evilact></evilact>") - тот же паттерн, что и выше у
                    // построек, но суффиксом, а не префиксом (см. CLAUDE.md, раздел 8.3)
                    enName = enName.replace(/\s*<[a-zA-Z]+><\/[a-zA-Z]+>\s*$/, "").trim();
                    if (enName.length < 3) return;
                    if (RBBP_EXCLUDED_EN_NAMES.has(enName)) return;
                    if (!index.has(enName)) index.set(enName, entry);
                }

                function byKey(arr, key) {
                    const m = new Map();
                    for (const e of arr) {
                        if (e && e[key] !== undefined && e[key] !== null && !m.has(e[key])) m.set(e[key], e);
                    }
                    return m;
                }

                // Названия типов оружия из таблицы множителей урона Рейнджера (Sniper
                // Shot/Scatter Shot) случайно совпадают с реальными именами юнитов/способностей
                // в данных игры (Magelock - юнит, Javelin - способность броска копья и т.д.) -
                // в контексте этой таблицы это категория предмета, а не конкретная карточка,
                // поэтому для них ссылка сознательно не строится вообще.
                const RBBP_EXCLUDED_EN_NAMES = new Set([
                    "Crossbow",
                    "Floating Daggers",
                    "Floating",
                    "Magelock",
                    "Greatbow",
                    "Bow",
                    "Blowgun",
                    "Sword and Crossbow",
                    "Pistol and Sword",
                    "Javelin",
                    "Sword and Daggers",
                    "Sword and Net",
                    "Champion",
                    "Observer",
                    "Tower",
                    "Frozen",
                    "Haunted",
                    "Dragon",
                    "Construct",
                    "Animal",
                    "Fury",
                    "Frost Giant",
                    "Rock Giant",
                    "Sword and Whip",
                    // "Vigor" (HeroSkills.json) встречается 9 раз в 5 разных классах героев,
                    // и у части классов РАЗНЫЕ иконки для одного и того же имени (Defender
                    // отличается от Warrior/Death Knight/Spellblade) - линковка по голому
                    // имени показала бы неверную иконку для части классов, см. комментарий
                    // у индексации HeroSkills.json ниже.
                    "Vigor",
                    // "Defense" - та же ловушка, что и "Vigor": имя навыка HeroSkills.json
                    // повторяется в 5+ классах (Warrior/Defender/Mage/Ranger/Battlesaint) с
                    // РАЗНЫМИ иконками у каждого. Плюс это ещё и заголовок группы Form Traits
                    // "## Защита (Defense)" - без исключения RU-скобки "(Defense)" в этом
                    // групповом заголовке (не про конкретный трейт) ложно линковались на
                    // случайный навык не того класса.
                    "Defense"
                ]);

                const [
                    tomesEN,
                    tomesLoc,
                    strucEN,
                    strucLoc,
                    unitsEN,
                    unitsLoc,
                    spellsEN,
                    spellsLoc,
                    abilitiesEN,
                    abilitiesLoc,
                    empireEN,
                    empireLoc,
                    heroSkillsEN,
                    heroSkillsLoc,
                    traitsEN,
                    traitsLoc
                ] = await Promise.all([
                        fetch(`/rbbp/Data/EN/Tomes.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/${contentLang}/Tomes.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/EN/StructureUpgrades.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/${contentLang}/StructureUpgrades.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/EN/Units.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/${contentLang}/Units.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/EN/Spells.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/${contentLang}/Spells.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/EN/Abilities.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/${contentLang}/Abilities.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/EN/EmpireProgression.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/${contentLang}/EmpireProgression.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/EN/HeroSkills.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/${contentLang}/HeroSkills.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/EN/Traits.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/${contentLang}/Traits.json`).then((r) => r.json())
                    ]);

                // та же дедупликация имён, что и в общем пайплайне SanitizeLocalizedNames()
                if (typeof splitDuplicatedLocalizedText === "function") {
                    for (const tome of tomesLoc) {
                        if ("name" in tome) tome.name = splitDuplicatedLocalizedText(tome.name);
                    }
                }

                const tomesLocByResid = byKey(tomesLoc, "resid");
                for (const tome of tomesEN) {
                    if (!tome.icon) continue;
                    add(tome.name, {
                        type: "tome",
                        icon: `/rbbp/Icons/TomeIcons/${tome.icon}.png`,
                        obj: tome,
                        loc: tomesLocByResid.get(tome.resid)
                    });
                }

                const strucLocByResid = byKey(strucLoc, "resid");
                for (const struc of strucEN) {
                    if (!struc.icon) continue;
                    add(struc.name, {
                        type: "structure",
                        icon: `/rbbp/Icons/UpgradeIcons/${struc.icon}.png`,
                        obj: struc,
                        loc: strucLocByResid.get(struc.resid)
                    });
                }

                const unitsLocByResid = byKey(unitsLoc, "resid");
                for (const unit of unitsEN) {
                    if (!unit.id) continue;
                    add(unit.name, {
                        type: "unit",
                        icon: `/rbbp/PreviewsAvif/${unit.id}.avif`,
                        obj: unit,
                        loc: unitsLocByResid.get(unit.resid)
                    });
                }

                // "Gesture of Goodwill" (icon-код CBE7688B0000080C) - файла в Icons/SpellIcons/
                // нет вообще (не заглушка - проверено `find` по всей папке Icons), но тот же
                // код иконки реально экспортирован в Icons/EmpireProgressionIcons/ (то же
                // заклинание ещё и перк Дерева империи с тем же именем и тем же icon-кодом).
                // Не входит в incorrectIconOverrideList (Data/src/dataloader.js) - тот список
                // редиректит на SummonIcons, а там этого файла тоже нет; похоже, это отдельный,
                // ранее не замеченный баг данных, который затрагивает и настоящую карточку
                // заклинания на Spells.html, не только эту страницу.
                const RBBP_SPELL_ICON_FOLDER_OVERRIDE = { gesture_of_goodwill: "EmpireProgressionIcons" };

                const spellsLocByResid = byKey(spellsLoc, "resid");
                for (const spell of spellsEN) {
                    // у заклинаний призыва (Summon Spell) поле icon часто пустое в данных
                    // игры - для них картинка называется по EN id и лежит в SummonIcons
                    // (та же особенность, что и incorrectIconOverrideList в Builder.js)
                    const iconFolder = RBBP_SPELL_ICON_FOLDER_OVERRIDE[spell.id] || "SpellIcons";
                    const iconPath = spell.icon
                        ? `/rbbp/Icons/${iconFolder}/${spell.icon}.png`
                        : spell.id
                          ? `/rbbp/Icons/SummonIcons/${spell.id}.png`
                          : null;
                    if (!iconPath) continue;
                    add(spell.name, {
                        type: "spell",
                        icon: iconPath,
                        obj: spell,
                        loc: spellsLocByResid.get(spell.resid)
                    });
                }

                const abilitiesLocBySlug = byKey(abilitiesLoc, "slug");
                for (const ability of abilitiesEN) {
                    if (!ability.icon) continue;
                    add(ability.name, {
                        type: "ability",
                        icon: `/rbbp/Icons/UnitIcons/${ability.icon}.png`,
                        obj: ability,
                        loc: abilitiesLocBySlug.get(ability.slug)
                    });
                }

                // EmpireProgression.json (перки Дерева империи) не имеет поля resid вообще
                // (как и Governance.json, см. CLAUDE.md раздел 2.4), а RU id - локализованная
                // строка, не слаг ("Приверженность_космосу"), так что единственный надёжный
                // способ сопоставить EN-запись с RU-переводом - позиционный индекс массива
                // (проверено: required_level и cost совпадают попарно на всех 143 записях -
                // порядок в обоих языках идентичен).
                for (let i = 0; i < empireEN.length; i++) {
                    const emp = empireEN[i];
                    if (!emp.icon) continue;
                    add(emp.name, {
                        type: "empire",
                        icon: `/rbbp/Icons/EmpireProgressionIcons/${emp.icon}.png`,
                        obj: emp,
                        loc: empireLoc[i]
                    });
                }

                // HeroSkills.json (пассивки/навыки в деревьях классов героев, напр.
                // Willbreaker/Vigor/Bladestorm) - EN и RU сопоставляются по resid, как обычно
                // (проверено: 0 из 827 EN-записей без пары в RU по resid). ВАЖНО: некоторые
                // названия повторяются ОДИНАКОВО у нескольких классов с одной и той же иконкой
                // (Willbreaker - Warrior/Death Knight/Warlock, icon один и тот же для всех
                // трёх) - для них линковка по голому имени безопасна. Но "Vigor" - другой
                // случай: это имя встречается 9 раз в 5 разных классах, и у части классов
                // РАЗНЫЕ иконки для одного и того же имени (Defender's Vigor I/II отличается
                // от Warrior/Death Knight/Spellblade) - при линковке по голому имени первое
                // добавленное в индекс совпадение "выиграет" для всех остальных классов, что
                // даст неверную иконку. Раз безопасного способа отличить "чья именно Vigor"
                // по голому имени нет, "Vigor" сознательно в RBBP_EXCLUDED_EN_NAMES.
                const heroSkillsLocByResid = byKey(heroSkillsLoc, "resid");
                for (const skill of heroSkillsEN) {
                    if (!skill.icon) continue;
                    add(skill.name, {
                        type: "heroskill",
                        icon: `/rbbp/Icons/UnitIcons/${skill.icon}.png`,
                        obj: skill,
                        loc: heroSkillsLocByResid.get(skill.resid)
                    });
                }

                // Traits.json, type "form"/"society" (Особенности облика / Form Traits,
                // напр. Obsidian Wyvern Mounts, и Социальные особенности / Social Traits,
                // напр. Bannerlords - шесть групп по приверженности на
                // FactionCreation.html?type=society&affinity=...) - страница
                // FactionCreation.html читает их из этого же файла под именем
                // jsonFactionCreation2 (см. Data/src/dataloader.js - имя переменной вводит
                // в заблуждение, это НЕ Data/GEN/FactionCreation.json). Как и
                // EmpireProgression.json/Governance.json, поля resid тут нет вообще -
                // сопоставление EN/RU позиционное (проверено отдельно для каждого type:
                // icon и point_cost совпадают попарно на всех 71 form-записях и всех 53
                // society-записях, порядок идентичен в обоих языках, включая единственную
                // запись без иконки "Observer" (enabled: false, служебная - стоит на той
                // же позиции в RU)). Иконка - Icons/TraitIcons/{icon}.png (проверено
                // файловой системой, все 71+52 файла на месте). У form ни одного
                // повторяющегося icon-кода; у society 8 второстепенных легендарных
                // трейтов (Cannibals/Malformed/Regenerating/Spider Worshippers/Doomed/
                // Lucky Ones/Verminous/Chosen) делят один и тот же общий "безликий"
                // плейсхолдер-значок без уникального арта - это не баг и не Vigor-подобная
                // коллизия (там разные ИКОНКИ на одно ИМЯ, тут одна и та же иконка на
                // РАЗНЫЕ уникальные имена - линковка по имени однозначна и безопасна).
                const traitsLinkableEN = traitsEN.filter((t) => t.type === "form" || t.type === "society");
                const traitsLinkableLoc = traitsLoc.filter((t) => t.type === "form" || t.type === "society");
                for (let i = 0; i < traitsLinkableEN.length; i++) {
                    const trait = traitsLinkableEN[i];
                    if (!trait.icon) continue;
                    add(trait.name, {
                        type: "trait",
                        icon: `/rbbp/Icons/TraitIcons/${trait.icon}.png`,
                        obj: trait,
                        loc: traitsLinkableLoc[i]
                    });
                }

                return index;
            }

            // Основной триггер - "(Заглавные Английские Слова)", ровно тот паттерн, которым
            // автор документа сам размечает игровые названия в скобках рядом с RU-текстом.
            //
            // На EN-версии этих скобок в тексте почти никогда нет - незачем повторять
            // английское имя английскими же буквами рядом с самим собой, оно и так стоит
            // прямо в прозе ("Unit - Aspirant Knight T2", без "(Aspirant Knight)"). Поэтому
            // для EN эта же комбинированная regex-альтернация ДОПОЛНИТЕЛЬНО включает прямое
            // совпадение по голым именам сущностей - тот же приём longest-first / единый
            // проход, что и в buildAbilityTagCache() (Builder.js): длинные имена идут первыми
            // в альтернации, поэтому более короткое имя не может задвоить совпадение внутри
            // уже найденного длинного (regex-альтернация - first-match-wins, не
            // longest-match-wins). Список исключений (RBBP_EXCLUDED_EN_NAMES, см. add() выше)
            // действует одинаково для обеих веток, потому что применяется на этапе построения
            // индекса, а не самого regex.
            function BuildRbbpLinkRegex(index, contentLang) {
                const parenPart = "\\(([A-Z][A-Za-z0-9''\\-\\s]*?)\\)";
                if (contentLang !== "EN") {
                    return new RegExp(parenPart, "g");
                }
                // EN: только явный маркер {{Name}}, расставленный вручную при переводе -
                // никакого сканирования всего текста по всем именам индекса. Раньше EN
                // матчился по голым словам (та же техника, что buildAbilityTagCache), но
                // обычные английские слова из прозы регулярно СЛУЧАЙНО совпадают с реальным
                // юнитом/способностью где-то в данных игры (Champion, Observer, Tower,
                // Dragon, Construct, Fury...) - список исключений расширялся почти на
                // каждом раунде фидбека и не мог быть полным в принципе. Явная разметка
                // убирает саму возможность такой коллизии: без {{...}} слово никогда не
                // станет ссылкой, что бы оно ни совпало (см. CLAUDE.md, раздел 8.2).
                const explicitPart = "\\{\\{([^}]+)\\}\\}";
                return new RegExp(`${parenPart}|${explicitPart}`, "g");
            }

            function LinkRbbpEntitiesByEnglishName(html, index, contentLang) {
                window.__rbbpEntityData = {};
                let counter = 0;

                // не трогаем текст внутри заголовков, которые УЖЕ несут вручную
                // расставленную иконку (rbbp-inline-icon от кода [hero]/[warhero]/...) -
                // тот же "Champion"/"(Champion)" иногда ЕЩЁ и совпадает с названием юнита/
                // способности/заклинания в данных игры, без этой защиты сюда добавлялась бы
                // вторая, лишняя иконка. Заголовки БЕЗ такого кода (напр. названия книг - для
                // них отдельного кода нет) через эту защиту не трогаются и линкуются как обычно.
                const headings = [];
                html = html.replace(/<h[234][^>]*>[\s\S]*?<\/h[234]>/g, (m) => {
                    if (m.indexOf("rbbp-inline-icon") === -1) return m;
                    const token = `__RBBP_HEADING_${headings.length}__`;
                    headings.push(m);
                    return token;
                });

                // не трогаем текст уже существующих ссылок (markdown-ссылки из исходника,
                // напр. "Steam Workshop::RbbP") - названия там иногда случайно содержат
                // слово, совпадающее с игровой сущностью ("Workshop" - реальная постройка),
                // и ссылка внутри ссылки только запутывает читателя
                const links = [];
                html = html.replace(/<a\s[^>]*>[\s\S]*?<\/a>/g, (m) => {
                    const token = `__RBBP_LINK_${links.length}__`;
                    links.push(m);
                    return token;
                });

                const regex = BuildRbbpLinkRegex(index, contentLang);

                html = html.replace(regex, (match, parenName, explicitName) => {
                    // скобочная ветка (RU) - parenName задан, видимые скобки нужно
                    // воспроизвести вокруг ссылки; явный маркер {{...}} (EN) - explicitName
                    // задан, сама разметка невидима, скобки вокруг ссылки не нужны
                    const isParen = parenName !== undefined;
                    const name = isParen ? parenName.trim() : explicitName !== undefined ? explicitName.trim() : match;
                    const entry = index.get(name);
                    if (!entry) return match;

                    // Юниты - просто кликабельная ссылка на карточку юнита в вики (как
                    // ссылки на книги в самой вики), без иконки и без выпадающего тултипа.
                    if (entry.type === "unit") {
                        const unitUrl = "/rbbp/HTML/Units.html?unit=" + encodeURIComponent(entry.obj.id);
                        const link = '<a href="' + unitUrl + '">' + name + "</a>";
                        return isParen ? "(" + link + ")" : link;
                    }

                    counter++;
                    const key = "rbbp-ent-" + counter;
                    window.__rbbpEntityData[key] = entry;
                    const nameSpan = '<span style="text-decoration:underline;">' + name + "</span>";
                    const handlerSpan =
                        '<span class="rbbpEntityHandler" data-rbbp-key="' +
                        key +
                        '"><img class="rbbp-entity-icon" src="' +
                        entry.icon +
                        '" onerror="this.style.display=\'none\'">' +
                        (isParen ? "(" + nameSpan + ")" : nameSpan) +
                        "</span>";

                    // Книги - вдобавок к иконке и тултипу делаем кликабельными: открывают
                    // карточку тома в вики (та же логика, что и для юнитов).
                    if (entry.type === "tome") {
                        const tomeUrl = "/rbbp/HTML/Spells.html?tome=" + encodeURIComponent(entry.obj.id);
                        return '<a href="' + tomeUrl + '" style="text-decoration:none;">' + handlerSpan + "</a>";
                    }

                    return handlerSpan;
                });

                links.forEach((l, i) => {
                    html = html.replace(`__RBBP_LINK_${i}__`, l);
                });

                headings.forEach((h, i) => {
                    html = html.replace(`__RBBP_HEADING_${i}__`, h);
                });

                return html;
            }

            function AttachRbbpEntityTooltips(article) {
                const handlers = article.querySelectorAll(".rbbpEntityHandler");
                handlers.forEach((el) => {
                    const key = el.dataset.rbbpKey;
                    const entry = (window.__rbbpEntityData || {})[key];
                    if (!entry) return;
                    const tooltip = document.createElement("span");
                    tooltip.innerHTML = BuildRbbpEntityTooltip(entry);
                    addTooltipListeners(el, tooltip, "something");
                });
            }

            function BuildRbbpEntityTooltip(entry) {
                const displayName = (entry.loc && entry.loc.name) || entry.obj.name;

                // SetTomePreview() читает АМБИЕНТНЫЙ jsonTomesLocalized (следует за глобальным
                // переключателем языка сайта), а не за языком этой статьи - переиспользуем её
                // только когда они совпадают, иначе тултип может внезапно оказаться не на том
                // языке. entry.obj для тома - уже EN-объект, доп. поиск по resid не нужен.
                const ambientMatchesContent =
                    typeof languageSelect !== "undefined" && languageSelect.value === window.__rbbpContentLang;

                if (
                    entry.type === "tome" &&
                    ambientMatchesContent &&
                    typeof SetTomePreview === "function"
                ) {
                    const span = document.createElement("span");
                    try {
                        SetTomePreview(span, entry.obj);
                        return span.innerHTML;
                    } catch (e) {
                        console.error("SetTomePreview failed for RBBP Patch Notes tooltip", e);
                    }
                }

                const icon = '<img src="' + entry.icon + '" width="30" style="float:left;margin-right:8px;">';
                const underline =
                    '<span style="color:white; text-decoration:underline; font-size:16px;">' + displayName + "</span><br>";

                const descSource = entry.loc || entry.obj;
                let desc = "";
                if (descSource) {
                    desc = descSource.description || descSource.gameplay_description || descSource.lore_description || "";
                }
                const body = desc ? AddTagIconsForStatusEffects(desc) : "";

                return icon + underline + body;
            }

            function BuildRbbpToc(article) {
                const tocRoot = document.getElementById("rbbpToc");
                // Оглавление - двухуровневое (h2 -> h3), h4 в него сознательно не
                // включаем - в длинных разделах (напр. "Культуры") h4 даёт слишком
                // мелкую, третью вложенность и превращает панель в нечитаемую простыню.
                // Сами h4-заголовки на странице остаются, просто не дублируются в TOC.
                const headings = article.querySelectorAll("h2, h3");
                if (headings.length === 0) {
                    tocRoot.style.display = "none";
                    return;
                }

                const list = document.createElement("ul");
                let currentH2Sub = null;

                headings.forEach((h, idx) => {
                    if (!h.id) h.id = "rbbp-sec-" + idx;

                    const link = document.createElement("a");
                    link.href = "#" + h.id;
                    link.textContent = h.textContent;
                    link.addEventListener("click", (evt) => {
                        evt.preventDefault();
                        h.scrollIntoView({ behavior: "smooth", block: "start" });
                        history.replaceState(null, "", "#" + h.id);
                    });

                    if (h.tagName === "H2") {
                        const li = document.createElement("li");
                        li.appendChild(link);
                        currentH2Sub = document.createElement("ul");
                        currentH2Sub.className = "rbbp-toc-sub";
                        li.appendChild(currentH2Sub);
                        list.appendChild(li);
                    } else if (h.tagName === "H3" && currentH2Sub) {
                        const subLi = document.createElement("li");
                        subLi.appendChild(link);
                        currentH2Sub.appendChild(subLi);
                    }
                });

                tocRoot.appendChild(list);

                // подсветка текущего раздела при прокрутке - следим только за
                // заголовками, попавшими в TOC (h2/h3); пока читатель листает h4-
                // подпункты внутри раздела, родительский h3 остаётся подсвеченным -
                // это и есть корректное поведение для двухуровневого меню
                const allLinks = Array.from(tocRoot.querySelectorAll("a"));
                const observer = new IntersectionObserver(
                    (entries) => {
                        entries.forEach((entry) => {
                            const link = tocRoot.querySelector('a[href="#' + entry.target.id + '"]');
                            if (!link) return;
                            if (entry.isIntersecting) {
                                allLinks.forEach((l) => l.classList.remove("rbbp-toc-active"));
                                link.classList.add("rbbp-toc-active");
                            }
                        });
                    },
                    { rootMargin: "0px 0px -70% 0px" }
                );
                headings.forEach((h) => observer.observe(h));
            }
        </script>
    </head>

    <body>
        <div id="header"></div>

        <div class="rbbp-page">
            <nav class="rbbp-toc" id="rbbpToc">
                <div class="rbbp-toc-title">Содержание</div>
            </nav>

            <article class="rbbp-article">
                <div class="rbbp-banner">
                    <img src="/rbbp/Icons/Interface/rbbp_emblem.png" alt="RBBP" />
                    <div>
                        <div class="rbbp-title">RbbP Patch Notes</div>
                        <div class="rbbp-subtitle" id="rbbpSubtitle">История изменений мода RbbP по релизам</div>
                        <div id="rbbpBacklinks"></div>
                    </div>
                </div>

                <div id="rbbpNotice" class="rbbp-notice" style="display: none"></div>

                <div id="rbbpContent">Loading...</div>
            </article>
        </div>
    </body>
</html>
