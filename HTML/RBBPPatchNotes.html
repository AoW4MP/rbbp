        <script src="/rbbp/Data/Init.js"></script>
        <script>
            async function HandlePage() {
                const lang = (typeof languageSelect !== "undefined" && languageSelect.value) || "RU";
                const article = document.getElementById("rbbpContent");
                const notice = document.getElementById("rbbpNotice");

                let data = null;
                let usedFallback = false;

                if (lang !== "RU") {
                    try {
                        const res = await fetch("/rbbp/Data/" + lang + "/RBBPPatchNotes.json");
                        if (res.ok) {
                            data = await res.json();
                        }
                    } catch (e) {
                        // нет перевода для этого языка - используем RU как запасной вариант
                    }
                }

                if (!data) {
                    const res = await fetch("/rbbp/Data/RU/RBBPPatchNotes.json");
                    data = await res.json();
                    usedFallback = lang !== "RU";
                }

                if (usedFallback) {
                    notice.style.display = "block";
                    notice.innerHTML =
                        "This page hasn't been translated to English yet. Showing the Russian version below.";
                } else {
                    notice.style.display = "none";
                }

                let html = data.html;
                // сайтовая AddTagIconsForStatusEffects() тут НЕ используется: она матчит
                // способности/эффекты по голым RU-подстрокам без учёта контекста предложения
                // (см. ниже LinkRbbpEntitiesByEnglishName - её place заняла более точная система)
                html = RbbpTagResourceIcons(html);

                // содержимое страницы может быть на RU или EN в зависимости от того, какой
                // JSON реально загрузился (см. usedFallback выше), а глобальный переключатель
                // языка сайта у первого визита - EN и может не совпадать с этим, поэтому для
                // связывания сущностей нельзя полагаться на jsonTomesLocalized/jsonFactionCreation
                // "как есть" - они следуют ЗА глобальным переключателем, а не за языком этой статьи
                const contentLang = usedFallback ? "RU" : lang;
                window.__rbbpContentLang = contentLang;
                ApplyRbbpUiStrings(contentLang);
                const entityIndex = await BuildRbbpEntityIndexByEnglishName(contentLang);
                html = LinkRbbpEntitiesByEnglishName(html, entityIndex);

                article.innerHTML = html;

                if (typeof HandleExtraTooltips === "function") {
                    HandleExtraTooltips(article);
                }
                AttachRbbpEntityTooltips(article, entityIndex);

                BuildRbbpToc(article);
            }

            // ---------- локализация статичной "рамки" страницы (не JSON-контента) ----------
            const RBBP_UI_STRINGS = {
                RU: {
                    tocTitle: "Содержание",
                    subtitle: "История изменений мода RbbP по релизам",
                    backLink: "← Назад к основному руководству RBBP"
                },
                EN: {
                    tocTitle: "Contents",
                    subtitle: "RbbP mod changelog by release",
                    backLink: "← Back to the main RBBP guide"
                }
            };

            function ApplyRbbpUiStrings(contentLang) {
                const strings = RBBP_UI_STRINGS[contentLang] || RBBP_UI_STRINGS.RU;
                const tocTitle = document.querySelector(".rbbp-toc-title");
                const subtitle = document.querySelector(".rbbp-subtitle");
                const backLink = document.querySelector(".rbbp-backlink");
                if (tocTitle) tocTitle.textContent = strings.tocTitle;
                if (subtitle) subtitle.textContent = strings.subtitle;
                if (backLink) backLink.textContent = strings.backLink;
            }

            // ---------- иконки ресурсов рядом с числами (10 золота -> 10 <gold> золота) ----------
            const RBBP_RESOURCE_TAGS = [
                [/(\d+)(\s+)(золот[а-яё]*)/gi, "gold"],
                [/(\d+)(\s+)(маны|мана\b)/gi, "mana"],
                [/(\d+)(\s+)(знани[а-яё]*)/gi, "knowledge"],
                [/(\d+)(\s+)(пищ[а-яё]*)/gi, "food"],
                [/(\d+)(\s+)(производств[а-яё]*)/gi, "production"],
                [/(\d+)(\s+)(найм[а-яё]*)/gi, "draft"],
                [/(\d+)(\s+)(влияни[а-яё]*)/gi, "influence"],
                [/(\d+)(\s+)(стабильност[а-яё]*)/gi, "happiness"]
            ];

            function RbbpTagResourceIcons(html) {
                for (const [regex, tag] of RBBP_RESOURCE_TAGS) {
                    html = html.replace(regex, (m, num, space, word) => `${num}${space}<${tag}></${tag}>${word}`);
                }
                return html;
            }

            // ---------- ссылки на объекты вики: тома/постройки/юниты/заклинания/способности ----------
            // Триггер - ТОЛЬКО точное совпадение английского названия в скобках, которое
            // автор текста сам расставляет рядом с русским (напр. "Покров мрака (Pall of
            // Gloom)"). Раньше матчинг шёл по голым RU-подстрокам - это ловило случайные
            // совпадения обычных русских слов с названиями сущностей без учёта контекста
            // предложения (напр. "Призыв" как обычное слово vs субкультура "Призыв", или
            // "Покров мрака"/"Ритуал ускорения" как части описания vs совпадающее название
            // способности/заклинания в данных игры). Английские игровые названия гораздо
            // менее склонны к таким случайным коллизиям с обычной речью.
            //
            // Культуры/происхождения/классы/стремления героев сюда сознательно НЕ включены:
            // в этом документе они и так явно помечены кодами вида [hero]/[warhero] прямо в
            // заголовках - добавление их же в автопоиск давало задвоенные иконки на той же
            // строке (код уже вставил иконку, а автопоиск находил то же имя ещё раз).
            async function BuildRbbpEntityIndexByEnglishName(contentLang) {
                const index = new Map();

                function add(enName, entry) {
                    if (!enName) return;
                    enName = enName.trim();
                    if (enName.length < 3) return;
                    if (!index.has(enName)) index.set(enName, entry);
                }

                function byKey(arr, key) {
                    const m = new Map();
                    for (const e of arr) {
                        if (e && e[key] !== undefined && e[key] !== null && !m.has(e[key])) m.set(e[key], e);
                    }
                    return m;
                }

                const [tomesEN, tomesLoc, strucEN, strucLoc, unitsEN, unitsLoc, spellsEN, spellsLoc, abilitiesEN, abilitiesLoc] =
                    await Promise.all([
                        fetch(`/rbbp/Data/EN/Tomes.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/${contentLang}/Tomes.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/EN/StructureUpgrades.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/${contentLang}/StructureUpgrades.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/EN/Units.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/${contentLang}/Units.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/EN/Spells.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/${contentLang}/Spells.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/EN/Abilities.json`).then((r) => r.json()),
                        fetch(`/rbbp/Data/${contentLang}/Abilities.json`).then((r) => r.json())
                    ]);

                // та же дедупликация имён, что и в общем пайплайне SanitizeLocalizedNames()
                if (typeof splitDuplicatedLocalizedText === "function") {
                    for (const tome of tomesLoc) {
                        if ("name" in tome) tome.name = splitDuplicatedLocalizedText(tome.name);
                    }
                }

                const tomesLocByResid = byKey(tomesLoc, "resid");
                for (const tome of tomesEN) {
                    if (!tome.icon) continue;
                    add(tome.name, {
                        type: "tome",
                        icon: `/rbbp/Icons/TomeIcons/${tome.icon}.png`,
                        obj: tome,
                        loc: tomesLocByResid.get(tome.resid)
                    });
                }

                const strucLocByResid = byKey(strucLoc, "resid");
                for (const struc of strucEN) {
                    if (!struc.icon) continue;
                    add(struc.name, {
                        type: "structure",
                        icon: `/rbbp/Icons/UpgradeIcons/${struc.icon}.png`,
                        obj: struc,
                        loc: strucLocByResid.get(struc.resid)
                    });
                }

                const unitsLocByResid = byKey(unitsLoc, "resid");
                for (const unit of unitsEN) {
                    if (!unit.id) continue;
                    add(unit.name, {
                        type: "unit",
                        icon: `/rbbp/PreviewsAvif/${unit.id}.avif`,
                        obj: unit,
                        loc: unitsLocByResid.get(unit.resid)
                    });
                }

                const spellsLocByResid = byKey(spellsLoc, "resid");
                for (const spell of spellsEN) {
                    if (!spell.icon) continue;
                    add(spell.name, {
                        type: "spell",
                        icon: `/rbbp/Icons/SpellIcons/${spell.icon}.png`,
                        obj: spell,
                        loc: spellsLocByResid.get(spell.resid)
                    });
                }

                const abilitiesLocBySlug = byKey(abilitiesLoc, "slug");
                for (const ability of abilitiesEN) {
                    if (!ability.icon) continue;
                    add(ability.name, {
                        type: "ability",
                        icon: `/rbbp/Icons/UnitIcons/${ability.icon}.png`,
                        obj: ability,
                        loc: abilitiesLocBySlug.get(ability.slug)
                    });
                }

                return index;
            }

            // Совпадение только на "(Заглавные Английские Слова)" - т.е. ровно тот паттерн,
            // которым автор документа сам размечает игровые названия в скобках. Одна проходка
            // по regex + поиск в Map (без сортировки по длине и без риска повторного матчинга
            // внутри уже вставленной замены - для каждой найденной скобочной группы решение
            // "есть в индексе или нет" принимается один раз).
            const RBBP_EN_PAREN_RE = /\(([A-Z][A-Za-z0-9''\-\s]*?)\)/g;

            function LinkRbbpEntitiesByEnglishName(html, index) {
                window.__rbbpEntityData = {};
                let counter = 0;

                // не трогаем текст ВНУТРИ заголовков - там EN-имена в скобках (напр.
                // "Чемпион (Champion)") уже отмечены вручную кодом [hero] в markdown,
                // который уже вставил свою иконку; тот же "(Champion)" иногда ЕЩЁ и
                // совпадает с названием юнита/способности/заклинания в данных игры -
                // без этой защиты сюда добавлялась бы вторая, лишняя иконка
                const headings = [];
                html = html.replace(/<h[234][^>]*>[\s\S]*?<\/h[234]>/g, (m) => {
                    const token = `__RBBP_HEADING_${headings.length}__`;
                    headings.push(m);
                    return token;
                });

                html = html.replace(RBBP_EN_PAREN_RE, (match, name) => {
                    const trimmed = name.trim();
                    const entry = index.get(trimmed);
                    if (!entry) return match;
                    counter++;
                    const key = "rbbp-ent-" + counter;
                    window.__rbbpEntityData[key] = entry;
                    return (
                        '<span class="rbbpEntityHandler" data-rbbp-key="' +
                        key +
                        '"><img class="rbbp-entity-icon" src="' +
                        entry.icon +
                        '" onerror="this.style.display=\'none\'">(' +
                        '<span style="text-decoration:underline;">' +
                        trimmed +
                        "</span>)</span>"
                    );
                });

                headings.forEach((h, i) => {
                    html = html.replace(`__RBBP_HEADING_${i}__`, h);
                });

                return html;
            }

            function AttachRbbpEntityTooltips(article) {
                const handlers = article.querySelectorAll(".rbbpEntityHandler");
                handlers.forEach((el) => {
                    const key = el.dataset.rbbpKey;
                    const entry = (window.__rbbpEntityData || {})[key];
                    if (!entry) return;
                    const tooltip = document.createElement("span");
                    tooltip.innerHTML = BuildRbbpEntityTooltip(entry);
                    addTooltipListeners(el, tooltip, "something");
                });
            }

            function BuildRbbpEntityTooltip(entry) {
                const displayName = (entry.loc && entry.loc.name) || entry.obj.name;

                // SetTomePreview() читает АМБИЕНТНЫЙ jsonTomesLocalized (следует за глобальным
                // переключателем языка сайта), а не за языком этой статьи - переиспользуем её
                // только когда они совпадают, иначе тултип может внезапно оказаться не на том
                // языке. entry.obj для тома - уже EN-объект, доп. поиск по resid не нужен.
                const ambientMatchesContent =
                    typeof languageSelect !== "undefined" && languageSelect.value === window.__rbbpContentLang;

                if (
                    entry.type === "tome" &&
                    ambientMatchesContent &&
                    typeof SetTomePreview === "function"
                ) {
                    const span = document.createElement("span");
                    try {
                        SetTomePreview(span, entry.obj);
                        return span.innerHTML;
                    } catch (e) {
                        console.error("SetTomePreview failed for RBBP Patch Notes tooltip", e);
                    }
                }

                const icon = '<img src="' + entry.icon + '" width="30" style="float:left;margin-right:8px;">';
                const underline =
                    '<span style="color:white; text-decoration:underline; font-size:16px;">' + displayName + "</span><br>";

                const descSource = entry.loc || entry.obj;
                let desc = "";
                if (descSource) {
                    desc = descSource.description || descSource.gameplay_description || descSource.lore_description || "";
                }
                const body = desc ? AddTagIconsForStatusEffects(desc) : "";

                return icon + underline + body;
            }

            function BuildRbbpToc(article) {
                const tocRoot = document.getElementById("rbbpToc");
                const headings = article.querySelectorAll("h2, h3, h4");
                if (headings.length === 0) {
                    tocRoot.style.display = "none";
                    return;
                }

                const list = document.createElement("ul");
                let currentH2Sub = null;
                let currentH3Sub = null;

                headings.forEach((h, idx) => {
                    if (!h.id) h.id = "rbbp-sec-" + idx;

                    const link = document.createElement("a");
                    link.href = "#" + h.id;
                    link.textContent = h.textContent;
                    link.addEventListener("click", (evt) => {
                        evt.preventDefault();
                        h.scrollIntoView({ behavior: "smooth", block: "start" });
                        history.replaceState(null, "", "#" + h.id);
                    });

                    if (h.tagName === "H2") {
                        const li = document.createElement("li");
                        li.appendChild(link);
                        currentH2Sub = document.createElement("ul");
                        currentH2Sub.className = "rbbp-toc-sub";
                        li.appendChild(currentH2Sub);
                        list.appendChild(li);
                        currentH3Sub = null;
                    } else if (h.tagName === "H3" && currentH2Sub) {
                        const subLi = document.createElement("li");
                        subLi.appendChild(link);
                        currentH3Sub = document.createElement("ul");
                        currentH3Sub.className = "rbbp-toc-subsub";
                        subLi.appendChild(currentH3Sub);
                        currentH2Sub.appendChild(subLi);
                    } else if (h.tagName === "H4" && (currentH3Sub || currentH2Sub)) {
                        const subSubLi = document.createElement("li");
                        subSubLi.appendChild(link);
                        (currentH3Sub || currentH2Sub).appendChild(subSubLi);
                    }
                });

                tocRoot.appendChild(list);

                // подсветка текущего раздела при прокрутке
                const allLinks = Array.from(tocRoot.querySelectorAll("a"));
                const observer = new IntersectionObserver(
                    (entries) => {
                        entries.forEach((entry) => {
                            const link = tocRoot.querySelector('a[href="#' + entry.target.id + '"]');
                            if (!link) return;
                            if (entry.isIntersecting) {
                                allLinks.forEach((l) => l.classList.remove("rbbp-toc-active"));
                                link.classList.add("rbbp-toc-active");
                            }
                        });
                    },
                    { rootMargin: "0px 0px -70% 0px" }
                );
                headings.forEach((h) => observer.observe(h));
            }
        </script>
