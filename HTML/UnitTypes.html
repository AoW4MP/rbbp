<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="/rbbp/Style/style.css" />
        <link rel="shortcut icon" href="/rbbp/favicon.ico" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
        <script src="/rbbp/Data/Init.js"></script>
        <script>
            function HandlePage() {
                const trait = new URLSearchParams(location.search).get("trait");
                const type = { spider: "Spider", penguin: "Penguin" };
                if (!Object.hasOwn(type, trait)) return;

                const ability = findBy(jsonUnitAbilities, "name", type[trait]);
                const localized = findBy(jsonUnitAbilitiesLocalized, "slug", ability.slug) || ability;
                const title = document.querySelector(".textblocktitle");
                const icon = document.createElement("img");
                icon.src = "/rbbp/Icons/UnitIcons/" + ability.icon + ".png";
                icon.height = 40;
                icon.alt = "";
                title.append(icon, " " + localized.name);
                document.title = "Age of Wonders 4 RbbP - " + localized.name;

                ShowUnitsWithSecondaryPassive(trait, localized.name + " ");
                SetLevelUpStuff();
                SetCollapsibleStuff();
            }
        </script>
        <title>Age of Wonders 4 RbbP - Unit Types</title>
    </head>
    <body>
        <div class="textblocktitle"></div>
        <div class="w3-container">
            <div class="w3-bar w3-black" id="buttonHolder"></div>
            <div id="dataHolder"></div>
        </div>
    </body>
</html>
