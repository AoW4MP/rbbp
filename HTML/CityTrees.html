                const entry = jsonFactionCreation.find((entry) => entry.id === key || culture + "_" + entry.id === key);

            function selectedOverrides() {
                const culture = document.getElementById("cultureSelect").value;
                const sub = document.getElementById("subcultureSelect").value;
                const replacements = new Map();
                for (const key of [culture, sub]) {
                    for (const entry of overrideBuildings[key] || []) {
                        const [base, id] = entry.split(":");
                        replacements.set(base, {id, key});
                    }
                }
                return replacements;
            }

            function structureElement(id) {

            function setSubcultures(preferred) {
                const culture = document.getElementById("cultureSelect").value;
                const entry = jsonFactionCreation.find((entry) => entry.id === culture);
                const select = document.getElementById("subcultureSelect");
                select.replaceChildren();
                for (const sub of jsonFactionCreation.filter((sub) => sub.type === "SubCulture" && sub.requirement === entry.name)) {
                    const key = sub.id.startsWith(culture + "_") ? sub.id : culture + "_" + sub.id;
                    select.add(new Option(cultureName(key), key));
                }
                select.disabled = select.options.length === 0;
                if ([...select.options].some((option) => option.value === preferred)) select.value = preferred;
            }

            function updateConnector() {
                const svg = document.getElementById("SVGHolder");
                const origin = svg.getBoundingClientRect();
                svg.insertAdjacentHTML("afterbegin",
                    '<defs><marker id="city-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ced8ea"/></marker></defs>');

                const nodes = [...document.querySelectorAll(".tree-grid2 .entry")];
                const measured = new Map(nodes.map(node => [node, node.firstElementChild.getBoundingClientRect()]));
                const sectionOf = node => node.closest("[data-section]");
                const byResource = new Map();
                for (const node of nodes) {
                    if (node.dataset.resid) {
                        if (!byResource.has(node.dataset.resid)) byResource.set(node.dataset.resid, []);
                        byResource.get(node.dataset.resid).push(node);
                    }
                }

                const bundled = new Map(jsonCityTreeNodes.flatMap(rule => {
                    const targets = rule.id.startsWith("*") ?
                        nodes.filter(node => node.id.endsWith(rule.id.slice(1))) : [structureElement(rule.id)];
                    return targets.filter(Boolean).map(target => [target, rule.connectTo]);
                }));
                const lanes = new Map();
                const hallOne = structureElement("town_hall_i_town_center");
                const hallTwo = structureElement("town_hall_ii");
                for (const node of nodes) {
                    const rules = liveCityRules?.buildings[node.dataset.resid];
                    let groups;
                    if (rules) {
                        groups = rules.required_structure.map(({ property, providers }) => {
                            if (property === "4110283712782" || property === "4041564232987") return [hallOne].filter(Boolean);
                            if (property === "4578435137981") return [hallTwo].filter(Boolean);
                            return [...new Set(providers.flatMap(id => byResource.get(id) || []))];
                        });
                        // The starting city centre is a synthetic card without a resource ID.
                        if (node === hallTwo && hallOne && !groups.some(group => group.length)) groups.push([hallOne]);
                    } else {
                        groups = (bundled.get(node) || []).map(({ id }) => [structureElement(id)].filter(Boolean));
                    }

                    const pending = [];
                    const connected = new Set();
                    for (const group of groups) {
                        const others = group.filter(provider => provider !== node);
                        const sameSection = others.filter(provider => sectionOf(provider) === sectionOf(node));
                        const sources = sameSection.length ? sameSection : others;
                        if (!sources.length || sources.every(source => connected.has(source))) continue;
                        const source = sources.length === 1 ? sources[0] : null;
                        const route = source && sameSection.length && cityArrow(source, node, measured, origin, lanes);
                        if (route) {
                            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                            path.setAttribute("d", route);
                            path.setAttribute("fill", "none");
                            path.setAttribute("stroke", "#ced8ea");
                            path.setAttribute("stroke-width", "2");
                            path.setAttribute("marker-end", "url(#city-arrow)");
                            path.dataset.from = source.id;
                            path.dataset.to = node.id;
                            svg.append(path);
                        } else {
                            pending.push(sources);
                        }
                        sources.forEach(provider => connected.add(provider));
                    }
                    if (pending.length) addCityRequirementLabel(node, pending);
                    else if (node.dataset.tome) {
                        const link = document.createElement("a");
                        link.className = "city-requirement-link";
                        link.href = "/rbbp/HTML/Spells.html?tome=" + encodeURIComponent(node.dataset.tome);
                        link.textContent = "↳ " + node.dataset.tomeName;
                        link.title = cityText("Research: ", "Изучить книгу: ") + node.dataset.tomeName;
                        link.addEventListener("click", event => event.stopPropagation());
                        node.append(link);
                    }
                }
            }

            function cityArrow(source, target, measured, origin, lanes) {
                const from = measured.get(source);
                const to = measured.get(target);
                const gap = to.left - from.right;
                const y1 = from.top + from.height / 2;
                const y2 = to.top + to.height / 2;
                if (gap < 8) return null;

                const isHall = node => node.id.startsWith("town_hall_");
                if (isHall(source) && !isHall(target)) return null;

                // A long connection is readable only across an empty, straight corridor.
                if (gap > 45) {
                    if (Math.abs(y2 - y1) > 1) return null;
                    for (const box of measured.values()) {
                        if (box.left < to.left - 1 && box.right > from.right + 1 &&
                            y1 > box.top && y1 < box.bottom) return null;
                    }
                } else if (Math.abs(y2 - y1) > 480) {
                    return null;
                }

                const x1 = from.right - origin.left;
                const x2 = to.left - origin.left - 2;
                if (Math.abs(y2 - y1) <= 1) return `M ${x1},${y1 - origin.top} H ${x2}`;

                const middle = (x1 + x2) / 2;
                const range = [Math.min(y1, y2), Math.max(y1, y2)];
                for (const lane of [middle, middle - 5, middle + 5]) {
                    if (lane <= x1 + 2 || lane >= x2 - 2) continue;
                    const key = Math.round(lane);
                    const routes = lanes.get(key) || [];
                    if (routes.some(route => route.source !== source && range[0] < route.bottom && range[1] > route.top)) continue;
                    routes.push({ source, top: range[0], bottom: range[1] });
                    lanes.set(key, routes);
                    return `M ${x1},${y1 - origin.top} H ${lane} V ${y2 - origin.top} H ${x2}`;
                }
                return null;
            }

            function addCityRequirementLabel(node, groups) {
                const name = entry => entry.querySelector(".structureNodeTitle").textContent.trim();
                const text = groups.map(group => group.map(name).join(cityText(" or ", " или "))).join(" · ");
                const source = groups.length === 1 && groups[0].length === 1 ? groups[0][0] : null;
                const label = document.createElement(source ? "button" : "span");
                label.className = "city-requirement-link";
                label.textContent = "↳ " + text;
                label.title = cityText("Requires: ", "Требуется: ") + text;
                label.dataset.requires = groups.map(group => group.map(entry => entry.id).join("|")).join(",");
                if (source) {
                    label.type = "button";
                    label.addEventListener("click", event => {
                        event.stopPropagation();
                        closeTooltips();
                        source.scrollIntoView({ block: "nearest", inline: "center" });
                        source.focus({ preventScroll: true });
                    });
                }
                node.append(label);
            }

            function GetTomeBuilds(buildingMap) {
                const Buildings = {};
                const chunkSize = 6;

                for (let i = 0; i < buildingMap.length; i += chunkSize) {
                    const chunk = buildingMap.slice(i, i + chunkSize);
                    Buildings[i / chunkSize] = chunk;
                }
                return Buildings;
            }

            function GetAllBuildings() {
                let ListOfCityBuildings = [];
                let TomeBuildings = [];

                // 1️⃣ Collect city buildings
                for (const i in jsonStructureUpgrades) {
                    if (!jsonStructureUpgrades[i].is_sector_upgrade) {
                        ListOfCityBuildings.push(jsonStructureUpgrades[i].id);
                    }
                }

                // 2️⃣ Find tome buildings that match city buildings
                for (const j in jsonTomes) {
                    const tome = jsonTomes[j];
                    if (!("skills" in tome)) continue;

                    for (const k in tome.skills) {
                        const skill = tome.skills[k];
                        if ("upgrade_slug" in skill && ListOfCityBuildings.includes(skill.upgrade_slug)) {
                            TomeBuildings.push({
                                tomeId: tome, // Tome ID
                                buildingId: skill.upgrade_slug // Building ID
                            });
                        }
                    }
                }

                return TomeBuildings;
            }

            function findResources(text) {
                const regex = /\+\d+%?\s*<([^>]+)>/g;
                let match;
                const resources = new Set();

                while ((match = regex.exec(text)) !== null) {
                    resources.add(`<${match[1]}></${match[1]}>`);
                }

                return Array.from(resources).join("");
            }

            function GetTree(nameOverride, lines, parent, buildingMap) {
                const holder = document.createElement("div");
                holder.className = "tree-grid2";
                holder.dataset.section = nameOverride;
                const title = document.createElement("div");
                title.className = "textTitle";
                const titles = {
                    Fortifications: "Укрепления", City: "Город", "Wizard Tower": "Башня волшебника",
                    "Vampire Castle": "Замок вампира", "Tome Buildings": "Постройки книг", Trade: "Торговля"
                };
                title.textContent = cityText(nameOverride, titles[nameOverride]);
                holder.append(title);
                const replacements = selectedOverrides();
                let row = 0;
                for (const [lineName, buildings] of Object.entries(lines)) {
                    let col = 0;
                    const countBefore = holder.querySelectorAll(".entry").length;
                    for (const building of buildings) {
                        const tomeID = typeof building === "object" ? building.tomeId : "";
                        const buildingName = typeof building === "object" ? building.buildingId : building;
                        if (buildingName.startsWith("empty")) {
                            col += Number(buildingName.split("*")[1] || 1);
                            continue;
                        }
                        const replacement = replacements.get(buildingName);
                        if (buildingName.startsWith("iii_unlock") && !replacement) continue;
                        const id = replacement?.id || buildingName;
                        if (!buildingMap.some((b) => b.buildingId === id) || document.getElementById("tomeCheck").checked) {
                            handleStructure(id, row, col, holder, replacement?.key, tomeID, lineName);
                        }
                        col++;
                    }
                    if (holder.querySelectorAll(".entry").length > countBefore) row++;
                }
                // Remove columns left empty by the old full-culture comparison layout.
                const nodes = [...holder.querySelectorAll(".entry")];
                const columns = [...new Set(nodes.map((node) => parseFloat(node.style.left)))].sort((a, b) => a - b);
                for (const node of nodes) node.style.left = columns.indexOf(parseFloat(node.style.left)) * 210 + "px";
                if (!nodes.length) return;
                parent.append(holder);
                resizeParentToFitChildren(holder);
            }

            function resizeParentToFitChildren(parent) {
                const children = parent.querySelectorAll(":scope > *");
                let maxBottom = 0;
                let maxRight = 0;

                children.forEach((child) => {
                    // Get child offset relative to parent
                    const bottom = child.offsetTop + child.offsetHeight;
                    const right = child.offsetLeft + child.offsetWidth;

                    if (bottom > maxBottom) maxBottom = bottom;
                    if (right > maxRight) maxRight = right;
                });

                parent.style.height = `${maxBottom + 23}px`;
                parent.style.width = `${maxRight}px`;
            }

            function handleStructure(entry, rowIndex, columnIndex, Holder, override, tomeID, lineName) {
                if (entry == null) {
                    return;
                }
                var splits = entry.split(":");
                var structure = splits[0];
                var affinity = splits[1];

                // The dump reuses slugs for Town Center and the three Oathsworn quarters.
                const variants = {
                    town_hall_ii_castle: 4282082401405,
                    paragon_quarters: {
                        oathsworn_oath_of_strife: 5046586576921,
                        oathsworn_oath_of_righteousness: 5046586576920,
                        oathsworn_oath_of_harmony: 5046586576907
                    }[document.getElementById("subcultureSelect").value]
                };
                const info = jsonStructureUpgrades.find((entry) => entry.id === structure && entry.icon &&
                    (!variants[structure] || entry.resid === variants[structure]));
                if (info) {
                    SetUpStructureNodeNew(info, rowIndex, columnIndex, Holder, override, tomeID, lineName);
                }
            }

            function SetUpStructureNodeNew(structureInfo, rowIndex, columnIndex, holder, override, tomeID, lineName) {
                var nodeHeight = 124;
                var nodeWidth = 210;

                var structureInfoLoc = jsonStructureUpgradesLocalized.find(
                    (entry) => entry.resid == structureInfo.resid
                );
                if (structureInfoLoc == undefined) {
                    structureInfoLoc = structureInfo;
                }
                var newNode = CreateStructureNode(structureInfo, structureInfoLoc, override, tomeID, lineName);
                const top = 36 + rowIndex * nodeHeight;
                const left = columnIndex * nodeWidth;

                newNode.style.position = "absolute";
                newNode.style.left = left + "px";
                newNode.style.top = top + "px";

                holder.append(newNode);
            }

            const lineNameMap = [
                {
                    key: "goldline",
                    color: "rgb(118, 107, 43)"
                },
                {
                    key: "manaline",
                    color: "rgb(40, 85 ,144)"
                },
                {
                    key: "knowledgeline",
                    color: "rgb(106, 40, 144)"
                },
                {
                    key: "foodline",
                    color: "rgb(40, 144, 53)"
                },
                {
                    key: "draftline",
                    color: "rgb(144, 40, 40)"
                },
                {
                    key: "productionline",
                    color: "rgb(144, 80, 40)"
                },
                {
                    key: "fishline",
                    color: "rgb(40, 144, 141)"
                },
                {
                    key: "lavaline",
                    color: "rgb(165, 160, 10)"
                }
            ];

            function CreateStructureNode(structureInfo, structureInfoLoc, override, tomeID, lineName) {
                if (extraBuildings.includes(structureInfo)) {
                    const names = {
                        town_hall_i_town_center: "Ратуша I: Центр города", town_hall_ii: "Ратуша II",
                        town_hall_iii: "Ратуша III", town_hall_iv: "Ратуша IV", throne: "Престол"
                    };
                    structureInfoLoc = {...structureInfo, name: cityText(structureInfo.name, names[structureInfo.id])};
                    if (structureInfo.id === "town_hall_i_town_center") {
                        structureInfoLoc.description = cityText(structureInfo.description, "Расширяет город и открывает специализированные городские постройки.");
                        structureInfoLoc.prediction_description = cityText(structureInfo.prediction_description,
                            "<bulletlist><bullet>Войска в городе получают 5 <xp></xp> опыта каждый <turn></turn> ход</bullet><bullet>+20 <unitprod></unitprod> найма</bullet><bullet>+10 <happiness></happiness> стабильности города</bullet><bullet>+30 <food></food> пищи</bullet><bullet>+20 <production></production> производства</bullet></bulletlist>");
                    }
                }
                var i,
                    x = "";
                var name = structureInfoLoc.name;

                if (name.indexOf("<br>")) {
                    name = name.replaceAll("</br>", " ");
                    name = name.replaceAll("<br>", " ");
                }

                var newNode = document.createElement("DIV");

                newNode.className = "entry";
                var newNodeBackground = document.createElement("DIV");

                var img = document.createElement("IMG");
                // different palce when its the 4 I added here
                if(extraBuildings.includes(structureInfo)){
                     img.setAttribute("src", "/rbbp/Icons/ExtraIcons/" + structureInfo.icon + ".png");
                }else{
                     img.setAttribute("src", "/rbbp/Icons/UpgradeIcons/" + structureInfo.icon + ".png");
                }
          
                img.setAttribute("height", "40px");
                img.alt = "";
                img.className = "structureNodeIcon";
                newNode.setAttribute("id", structureInfo.id);
                if (structureInfo.resid !== undefined) newNode.dataset.resid = String(structureInfo.resid);

                var spa = document.createElement("SPAN");
                spa.className = "structureNodeTitle";
                for (const { key, color } of lineNameMap) {
                    if (key == lineName) {
                        const colorTwo = "rgb(0,0,0,0)";
                        spa.style.backgroundImage =
                            "linear-gradient(to right, " + colorTwo + ", " + color + ", " + colorTwo + ")";
                    }
                }

                newNodeBackground.className = "structureNode";

                spa.innerHTML = '<span style="color:  #d7c297;">' + name + "</span>" + "<br>";

                var spa2 = document.createElement("SPAN");
                spa2.setAttribute("style", "float:right");
                var desc = document.createElement("SPAN");
                desc.className = "structureNodeDesc";

                const { description, prediction_description, requirement_description, boost_requirements } = structureInfoLoc;
                const cleanText = (value) => (value || "")
                    .replace(/\s*\(\s*\)/g, "")
                    .replace(/<hyperlink>Здоровья<\/hyperlink>\s*ед\. здоровья/g, "ед. <hyperlink>здоровья</hyperlink>")
                    .trim();
                const appendList = (label, value) => {
                    const content = cleanText(value);
                    if (!content) return;
                    spa2.innerHTML += "<br>" + label + (content.startsWith("<bulletlist>")
                        ? content : "<bulletlist><bullet>" + content + "</bullet></bulletlist>");
                };
                spa2.innerHTML = '<span style="color: #d7c297;">' + name + "</span><br>";
                if (description) spa2.innerHTML += cleanText(description) + "<br>";

                // The hand-written descriptions of these buildings already list their effects.
                if (!["seafarers_guild", "necrotic_spires", "healing_spires"].includes(structureInfo.id) && prediction_description) {
                    spa2.innerHTML += cleanText(prediction_description) + "<br>";
                }
                if (structureInfo.id.startsWith("town_hall_iii_")) {
                    spa2.innerHTML += cityText("Unlocks T3 Culture Units", "Открывает войска культуры III ранга") + "<br>";
                }
                if (structureInfo.id.startsWith("town_hall_ii_")) {
                    spa2.innerHTML += cityText("Unlocks T2 Culture Units", "Открывает войска культуры II ранга") + "<br>";
                }

                const requirements = cityText("Requirements:", "Требования:");
                const requiredBuildings = liveCityRules?.buildings[structureInfo.resid]?.required_structure || [];
                const localName = (row) => findBy(jsonStructureUpgradesLocalized, "resid", row.resid)?.name || row.name;
                const requiredNames = requiredBuildings.map(({ providers }) => providers
                    .map((id) => {
                        const number = Number(id);
                        return findBy(jsonStructureUpgrades, "resid", Number.isSafeInteger(number) ? number : id);
                    })
                    .filter(Boolean)
                    .map(localName)
                    .join(cityText(" or ", " или ")))
                    .filter(Boolean);
                const tomeName = tomeID && (findBy(jsonTomesLocalized, "resid", tomeID.resid)?.name || tomeID.name);
                if (tomeName) {
                    requiredNames.unshift(cityText("Research ", "Изучить книгу: ") + tomeName);
                    newNode.dataset.tome = tomeID.id;
                    newNode.dataset.tomeName = tomeName;
                }
                const requirementDetails = cleanText(requirement_description);
                if (requiredNames.length || requirementDetails) {
                    const items = requiredNames.map((item) => "<bullet>" + item + "</bullet>").join("");
                    const extra = requirementDetails.startsWith("<bulletlist>")
                        ? requirementDetails.slice("<bulletlist>".length, -"</bulletlist>".length)
                        : requirementDetails && "<bullet>" + requirementDetails + "</bullet>";
                    appendList(requirements, "<bulletlist>" + items + extra + "</bulletlist>");
                }
                appendList(cityText("Boost Requirements:", "Условия ускорения:"), boost_requirements);

                // cost

                var cost = document.createElement("DIV");
                cost.setAttribute("style", "position:absolute; bottom:0px; right:0px");
                cost.innerHTML = structureInfo.cost;

                newNode.appendChild(newNodeBackground);
                if (override) {
                    newNodeBackground.style.backgroundImage = 'url("/rbbp/Icons/Text/' + override + '.png")';
                    newNodeBackground.style.backgroundRepeat = "no-repeat";
                    newNodeBackground.style.backgroundPositionX = "140px";
                    newNodeBackground.style.backgroundSize = "80px";
                    newNodeBackground.style.backgroundColor = "rgb(17,17,17)";
                }

                if (tomeID) {
                    newNodeBackground.style.backgroundImage = 'url("/rbbp/Icons/TomeIcons/' + tomeID.icon + '.png")';
                    newNodeBackground.style.backgroundRepeat = "no-repeat";
                    newNodeBackground.style.backgroundPositionX = "140px";
                    newNodeBackground.style.backgroundSize = "80px";
                    newNodeBackground.style.backgroundColor = "rgb(17,17,17)";
                }

                for (const { key, color, title } of iconBackgroundMap) {
                    if (key == override) {
                        newNodeBackground.style.backgroundColor = color;
                        spa2.innerHTML += "<br>" + cultureName(key);
                    }
                }

                var type = findResources(structureInfo.prediction_description + structureInfo.description);

                if (type != "") {
                    var Type = document.createElement("DIV");
                    Type.innerHTML += "+" + type;

                    Type.setAttribute("style", "position:absolute; bottom:30px; left:50px; right:4px; z-index:3;");
                    //Type.setAttribute("style", "float:left; z-index:3");
                    newNodeBackground.append(Type);
                }

                newNodeBackground.append(spa);
                newNodeBackground.append(cost);

                newNodeBackground.append(img);

                addTooltipListeners(newNode, spa2);
                newNode.tabIndex = 0;
                newNode.setAttribute("role", "button");
                newNode.setAttribute("aria-label", name.replace(/<[^>]*>/g, ""));
                newNode.addEventListener("focus", () => TurnOnTooltip(spa2));
                newNode.addEventListener("keydown", (event) => {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        TurnOnTooltip(spa2);
                    }
                });
                return newNode;
            }

        </script>
