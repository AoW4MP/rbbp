<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="shortcut icon" type="image/x-icon" href="/rbbp/favicon.ico" />
        <link rel="stylesheet" type="text/css" href="/rbbp/Style/style.css" />
        <link rel="stylesheet" type="text/css" href="/rbbp/Style/infusions.css" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
        <script src="/rbbp/Data/Init.js"></script>
        <script src="/rbbp/Data/src/forge_templates.js"></script>
        <script src="/rbbp/Data/src/infusions.js"></script>
        <title>Age of Wonders 4 RbbP - Item Forge</title>
    </head>
    <body class="infusions-page">
        <main class="infusion-catalog" aria-busy="true">
            <h1 class="textblocktitle" data-infusion-label="title">Item Forge</h1>
            <nav class="forge-views" aria-label="Item Forge">
                <a href="Infusions.html" id="forgeInfusionsLink">Infusions</a>
                <a href="Infusions.html?view=templates" id="forgeTemplatesLink">Templates</a>
            </nav>
            <section id="forgeTemplates" aria-labelledby="forgeTemplatesLink" hidden></section>
            <div id="forgeInfusions" aria-labelledby="forgeInfusionsLink">
                <div class="infusion-controls">
                    <label>
                        <span data-infusion-label="query">Search</span>
                        <input type="search" data-infusion-field="query" />
                    </label>
                    <div class="infusion-item-field">
                        <span data-infusion-label="item" id="infusionItemLabel">Item type</span>
                        <details class="infusion-item-picker">
                            <summary aria-labelledby="infusionItemLabel infusionItemSelection">
                                <span id="infusionItemSelection"></span>
                            </summary>
                            <div class="infusion-item-options"></div>
                        </details>
                    </div>
                    <label>
                        <span data-infusion-label="category">Infusion type</span>
                        <select data-infusion-field="category"></select>
                    </label>
                    <div class="infusion-sort">
                        <label>
                            <span data-infusion-label="sort">Sort by</span>
                            <select data-infusion-field="sort"></select>
                        </label>
                        <button id="infusionDirection" type="button" aria-pressed="true">↑</button>
                    </div>
                    <fieldset>
                        <legend data-infusion-label="unlock">Unlock requirement</legend>
                        <div class="infusion-materials"></div>
                    </fieldset>
                </div>
                <p id="infusionStatus" role="status">Loading…</p>
                <table class="infusion-results">
                    <thead>
                        <tr>
                            <th scope="col" data-infusion-label="name">Infusion</th>
                            <th scope="col" data-infusion-label="points">Points</th>
                            <th scope="col" data-infusion-label="condition">Unlock</th>
                            <th scope="col" data-infusion-label="compatibility">Compatible items</th>
                        </tr>
                    </thead>
                    <tbody id="infusionRows"></tbody>
                </table>
            </div>
        </main>
    </body>
</html>
